openapi: 3.1.0
info:
  title: Caddy Money API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: ok
  /auth/dev-login:
    post:
      summary: Beta magic link simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: token response
  /restricted/send:
    post:
      summary: Send restricted funds
      responses:
        '200':
          description: created
