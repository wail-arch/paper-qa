version: '3.9'
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env.example
    depends_on:
      - postgres
      - redis
      - mailhog
    command: pnpm dev
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./web/.env.example
    depends_on:
      - api
    command: pnpm dev -- --host 0.0.0.0
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: caddy
      POSTGRES_PASSWORD: caddy
      POSTGRES_DB: caddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
volumes:
  pgdata:
